name: Build and deploy

on:
  push:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image namespace
        id: image-names
        shell: bash
        run: echo "namespace=${REGISTRY}/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.namespace }}/backend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.namespace }}/frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE }}
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL }}
            VITE_REDIRECT_URI=${{ vars.VITE_REDIRECT_URI }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy on it-camp-main
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64, gpu, main]
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and start release
        env:
          IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: sha-${{ github.sha }}
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          KC_HOSTNAME: ${{ vars.KC_HOSTNAME }}
          KC_HOSTNAME_ADMIN: ${{ vars.KC_HOSTNAME_ADMIN }}
          KC_HTTP_PORT: ${{ vars.KC_HTTP_PORT }}
          KC_HTTP_ENABLED: ${{ vars.KC_HTTP_ENABLED }}
          KC_REALM: ${{ vars.KC_REALM }}
          KC_DB_URL_HOST: ${{ vars.KC_DB_URL_HOST }}
          KC_DB_URL_PORT: ${{ vars.KC_DB_URL_PORT }}
          KC_DB_URL_DATABASE: ${{ vars.KC_DB_URL_DATABASE }}
          KC_DB_USERNAME: ${{ vars.KC_DB_USERNAME }}
          KC_HEALTH_ENABLED: ${{ vars.KC_HEALTH_ENABLED }}
          KC_METRICS_ENABLED: ${{ vars.KC_METRICS_ENABLED }}
          KC_HOSTNAME_STRICT: ${{ vars.KC_HOSTNAME_STRICT }}
          KC_PROXY_HEADERS: ${{ vars.KC_PROXY_HEADERS }}
          KEYCLOAK_URL: ${{ vars.KEYCLOAK_URL }}
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          JAVA_OPTS: ${{ vars.JAVA_OPTS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          KC_BOOTSTRAP_ADMIN_USERNAME: ${{ vars.KC_BOOTSTRAP_ADMIN_USERNAME }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_KEYCLOAK_URL: ${{ vars.VITE_KEYCLOAK_URL }}
          VITE_REDIRECT_URI: ${{ vars.VITE_REDIRECT_URI }}
          DB_PASS: ${{ secrets.DB_PASS }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          IMAGE_NAMESPACE="$(printf '%s' "$IMAGE_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          export BACKEND_IMAGE="${IMAGE_NAMESPACE}/backend:${IMAGE_TAG}"
          export FRONTEND_IMAGE="${IMAGE_NAMESPACE}/frontend:${IMAGE_TAG}"
          umask 077
          : > .env
          for variable in \
            SPRING_PROFILES_ACTIVE DB_HOST DB_PORT DB_NAME DB_USER DB_PASS \
            REDIS_HOST REDIS_PORT KC_HOSTNAME KC_HOSTNAME_ADMIN KC_HTTP_PORT \
            KC_HTTP_ENABLED KC_REALM KC_DB_URL_HOST KC_DB_URL_PORT KC_DB_URL_DATABASE \
            KC_DB_USERNAME KC_DB_PASSWORD KC_HEALTH_ENABLED KC_METRICS_ENABLED \
            KC_HOSTNAME_STRICT KC_PROXY_HEADERS KC_BOOTSTRAP_ADMIN_USERNAME \
            KC_BOOTSTRAP_ADMIN_PASSWORD KEYCLOAK_URL LLM_ENDPOINT LLM_API_KEY \
            LLM_MODEL JAVA_OPTS LOG_LEVEL VITE_API_BASE VITE_KEYCLOAK_URL \
            VITE_REDIRECT_URI; do
            printf '%s=%s\n' "$variable" "${!variable}" >> .env
          done
          docker compose pull backend frontend
          docker compose up -d --remove-orphans
          docker compose ps

