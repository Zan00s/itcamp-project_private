server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:elouav}
    username: ${DB_USER:elouav}
    password: ${DB_PASS:elouav_dev}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/elouav/protocol/openid-connect/certs

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    module:
      kotlin:
        enabled: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info

ai:
  llm:
    endpoint: ${LLM_ENDPOINT:http://localhost:11434}
    api-key: ${LLM_API_KEY:test-key}
    model: ${LLM_MODEL:gpt-4o-mini}

logging:
  level:
    ru.itcamp.elouav: DEBUG
    org.springframework.security: DEBUG
