services:
  postgres:
    image: postgres:16-alpine
    container_name: elouav-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-elouav}
      POSTGRES_USER: ${DB_USER:-elouav}
      POSTGRES_PASSWORD: ${DB_PASS:-elouav_dev}
    ports:
      - "${PORT_POSTGRES:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elouav}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  redis:
    image: redis:7-alpine
    container_name: elouav-redis
    ports:
      - "${PORT_REDIS:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: elouav-keycloak
    command: ["start-dev", "--import-realm", "--http-port=${KC_HTTP_PORT:-8180}", "--health-enabled=true"]
    environment:
      KC_HTTP_RELATIVE_PATH: /
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_HOSTNAME: ${KC_HOSTNAME:-https://auth.it-camp-2026.ru}
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME_ADMIN:-https://auth.it-camp-2026.ru}
      KC_DB: postgres
      KC_DB_URL_HOST: ${KC_DB_URL_HOST:-postgres}
      KC_DB_URL_PORT: ${KC_DB_URL_PORT:-5432}
      KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak_dev}
      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED:-true}
      KC_METRICS_ENABLED: ${KC_METRICS_ENABLED:-true}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
    # ports:
    #   - "${PORT_KEYCLOAK:-8180}:${KC_HTTP_PORT:-8180}"
    volumes:
      - ./keycloak-config/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/${KC_HTTP_PORT:-8180}; echo -e 'GET /realms/${KC_REALM:-elouav} HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    networks:
      - app
      - nginx

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/example/elou-av/backend:${IMAGE_TAG:-latest}}
    build:
      context: ./backend
      dockerfile: Dockerfile.prebuilt
    container_name: elouav-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-elouav}
      DB_USER: ${DB_USER:-elouav}
      DB_PASS: ${DB_PASS:-elouav_dev}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.it-camp-2026.ru}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-http://localhost:11434}
      LLM_API_KEY: ${LLM_API_KEY:-test-key}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx256m}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    # ports:
    #   - "${PORT_BACKEND:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - app
      - nginx

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/example/elou-av/frontend:${IMAGE_TAG:-latest}}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-https://api.it-camp-2026.ru/api}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://auth.it-camp-2026.ru/realms/elouav}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:-https://it-camp-2026.ru/callback}
    container_name: elouav-frontend
    # ports:
    #   - "${PORT_FRONTEND:-3000}:80"
    depends_on:
      - backend
      - keycloak
    networks:
      - app
      - nginx

volumes:
  pgdata:
  redis-data:
  keycloak-data:

networks:
  app:
    name: app
    driver: bridge
    external: false
  nginx:
    external: true
