services:
  postgres:
    image: postgres:16-alpine
    container_name: elouav-postgres
    environment:
      POSTGRES_DB: elouav
      POSTGRES_USER: elouav
      POSTGRES_PASSWORD: elouav_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elouav"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: elouav-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: elouav-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/elouav
      KC_DB_USERNAME: elouav
      KC_DB_PASSWORD: elouav_dev
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
    ports:
      - "8090:8080"
    volumes:
      - ./keycloak-config/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elouav-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LLM_ENDPOINT: ${LLM_ENDPOINT:-http://host.docker.internal:8081/v1}
      LLM_API_KEY: ${LLM_API_KEY:-dummy}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-7b}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-5000}
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elouav-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redis-data:
