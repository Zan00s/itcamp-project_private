services:
  postgres:
    image: postgres:16-alpine
    container_name: elouav-postgres
    environment:
      POSTGRES_DB: elouav
      POSTGRES_USER: elouav
      POSTGRES_PASSWORD: elouav_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elouav"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: elouav-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: elouav-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: dev-file
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak-config/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8180/realms/elouav"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elouav-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: elouav
      DB_USER: elouav
      DB_PASS: elouav_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_URL: http://keycloak:8180
      LLM_ENDPOINT: ${LLM_ENDPOINT:-http://localhost:11434}
      LLM_API_KEY: ${LLM_API_KEY:-test-key}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elouav-frontend
    environment:
      VITE_API_BASE: http://localhost:8080/api
      VITE_KEYCLOAK_URL: http://localhost:8180/realms/elouav
      VITE_REDIRECT_URI: http://localhost:3000/callback
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redis-data:
